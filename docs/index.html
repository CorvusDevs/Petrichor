<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Petrichor, Calm Sounds for Sleep & Focus</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Petrichor is a calming sounds app for sleep, focus, and quiet moments. Layer rainfall, fireplaces, oceans, and more. No subscription.">
<style>
        /* ac-no-horizontal-scroll v1 */
        html, body {
            overflow-x: clip;
            max-width: 100%;
        }
        img, video, iframe {
            max-width: 100%;
            height: auto;
        }
        pre, table {
            max-width: 100%;
            overflow-x: auto;
        }

  :root {
    --bg: #0F1A2E;
    --bg-2: #1A2848;
    --fg: #F4E4C1;
    --fg-dim: rgba(244, 228, 193, 0.65);
    --accent: #E8B38F;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%); color: var(--fg); min-height: 100vh; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", system-ui, sans-serif;
    line-height: 1.6;
    padding: 0 24px;
  }
  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 120px 0 80px;
  }
  h1 {
    font-family: ui-serif, Georgia, "Times New Roman", serif;
    font-weight: 200;
    font-size: 5rem;
    letter-spacing: -0.03em;
    line-height: 1;
    margin-bottom: 0.4em;
  }
  .tagline {
    font-size: 1.3rem;
    color: var(--fg-dim);
    margin-bottom: 4em;
  }
  .coming {
    font-size: 0.95rem;
    color: var(--fg-dim);
    border-top: 1px solid rgba(244, 228, 193, 0.12);
    padding-top: 2em;
  }
  footer {
    margin-top: 6em;
    font-size: 0.85rem;
    color: rgba(244, 228, 193, 0.4);
  }
  footer a { color: inherit; }

        /* ac-footer-mobile v1 */
        @media (max-width: 720px) {
            body { min-height: 0; }
            footer { padding-bottom: 24px; padding-top: 24px; }
        }
</style>
</head>
<body>
<main>
  <h1>Petrichor</h1>
  <p class="tagline">Calm sounds for sleep and focus.</p>
  <p class="coming">Coming soon to the App Store for iPhone, iPad, and Mac.</p>
  <footer>
    <p>© 2026 CorvusDevs · <a href="support.html">Support</a> · <a href="privacy.html">Privacy</a></p>
  </footer>
</main>
</body>
</html>
